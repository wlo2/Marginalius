# Push a tag equal to the manifest version (e.g. 0.2.2). Obsidian's action lints with
# the directory's scanner rules, builds, attests main.js and styles.css, and creates
# a draft release with the three files. Publish the draft on the Releases page.
# Actions are pinned to commit SHAs: a moved tag can't change what builds and signs a
# release. Dependabot (.github/dependabot.yml) proposes updates.
name: Release
on:
  push:
    tags: ['*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci && npm test
      - uses: obsidianmd/obsidian-workflows@8167caed39664214d82c86fdfa32e06d8d55f61d # v1.2.3
        with:
          mode: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
