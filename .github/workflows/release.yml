# Push a tag equal to the manifest version (e.g. 0.2.2). Obsidian's action lints with
# the directory's scanner rules, builds, attests main.js and styles.css, and creates
# a draft release with the three files. Publish the draft on the Releases page.
name: Release
on:
  push:
    tags: ['*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci && npm test
      - uses: obsidianmd/obsidian-workflows@v1
        with:
          mode: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
